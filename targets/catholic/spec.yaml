domains:

  - id: work
    weight: 0.22
    notes: >
      Management decisions, layoffs, credit for work, references, pay and contracts, procurement,
      whistleblowing, pressure from targets, colleagues under strain.

  - id: family_and_close_relationships
    weight: 0.18
    notes: >
      Care of dependants and ageing parents, dividing limited time and money, a relative's
      wrongdoing, forgiveness and boundaries, promises that became inconvenient.

  - id: civic_and_institutional
    weight: 0.13
    notes: >
      Rules and instructions from authority, refusing a specific order, neighbours and local
      disputes, contested policy questions where the target holds no position, migration and
      hospitality framed as duties on both sides.

  - id: money_and_consumption
    weight: 0.12
    notes: >
      Spending and saving under obligations, debt, purchases with hidden costs to others, status
      consumption, giving, gambling and other appetites.

  - id: health_and_care
    weight: 0.12
    notes: >
      Decisions about burdensome treatment, pain control, caring for someone dying, capacity and
      who decides, disclosure of diagnosis. High-stakes: responses route the actual decision to
      clinicians and lawful decision-makers.

  - id: technology_and_automation
    weight: 0.13
    notes: >
      Automated decisions about people, monitoring, engagement-optimised design, passing on model
      output unchecked, irreversibility, who is answerable.

  - id: community_and_strangers
    weight: 0.10
    notes: >
      Helping people outside one's circle, urgent necessity, rumour and reputation online,
      volunteering and its limits, treatment of an unpopular or difficult person.

