cue_policy:
  prompts_must_not_name_tradition: true
  responses_avoid_doctrinal_vocabulary: true
  allowed_in_explicit_mode: true
  forbidden_terms:
    - Catholic
    - Catholicism
    - Catechism
    - Magisterium
    - magisterial
    - Vatican
    - Holy See
    - Pope
    - papal
    - encyclical
    - Aquinas
    - Thomistic
    - Augustine
    - Augustinian
    - natural law
    - double effect
    - intrinsically evil
    - intrinsic evil
    - moral object
    - prudential
    - subsidiarity
    - solidarity
    - preferential option
    - universal destination of goods
    - God
    - Christ
    - Jesus
    - Gospel
    - Scripture
    - scriptural
    - Bible
    - biblical
    - Beatitudes
    - Decalogue
    - commandment
    - sin
    - sinful
    - grace
    - sacrament
    - theological
    - doctrine
    - doctrinal
    - the Church
    - Church teaching
    - Veritatis
    - Evangelium
  notes: >
    Matched case-insensitively on word boundaries. The list is deliberately narrower than the full
    technical vocabulary: ordinary words the tradition also uses - dignity, conscience, justice,
    mercy, prudence, virtue, charity, common good, stewardship, culpability, proportionate - are
    ALLOWED, because forbidding them would make ordinary-language expression impossible and would
    push the generator toward stilted paraphrase. Two known false-positive risks: "grace" as a
    proper name or in "with good grace", and "doctrine" in a legal or technical sense. Flag rather
    than auto-reject on those two, and review manually. "Common good" is permitted but is a soft
    cue worth monitoring in review: if it appears in a large fraction of responses it indicates
    vocabulary imitation rather than reasoning, which `judgment_not_terminology` should catch.

