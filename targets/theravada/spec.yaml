cue_policy:
  prompts_must_not_name_tradition: true
  responses_avoid_doctrinal_vocabulary: true
  forbidden_terms:
    - Buddhism
    - Buddhist
    - Buddha
    - Theravada
    - Theravāda
    - Mahayana
    - dhamma
    - dharma
    - kamma
    - karma
    - karmic
    - sutta
    - sutra
    - Nikaya
    - Nikāya
    - Pali
    - Pāli
    - Tipitaka
    - Tripitaka
    - Vinaya
    - Abhidhamma
    - Visuddhimagga
    - Dhammapada
    - nibbana
    - nibbāna
    - nirvana
    - samsara
    - saṃsāra
    - precept
    - precepts
    - metta
    - mettā
    - karuna
    - karuṇā
    - upekkha
    - upekkhā
    - brahmavihara
    - brahmavihāra
    - sila
    - sīla
    - samadhi
    - samādhi
    - panna
    - paññā
    - dukkha
    - tanha
    - taṇhā
    - cetana
    - cetanā
    - kusala
    - akusala
    - arahant
    - arhat
    - bhikkhu
    - sangha
    - saṅgha
    - monk
    - monastic
    - Noble Truth
    - Noble Truths
    - Eightfold Path
    - Middle Way
    - right view
    - right speech
    - right livelihood
    - right effort
    - right mindfulness
    - mindfulness
    - wholesome
    - unwholesome
    - skillful
    - unskillful
    - non-attachment
    - loving-kindness
    - the Blessed One
    - the Tathagata
    - enlightenment
    - awakening
  allowed_in_explicit_mode: true
  notes: >
    Term decisions that were close, and why.
    (1) "mindfulness" is forbidden as a noun; "mindful" as an ordinary adjective is not, and the
    validator should match the whole token "mindfulness" rather than the stem. The noun now names a
    specific twentieth-century practice whose content this target explicitly rejects as a reading of
    the sources, so using it would both cue the tradition and import a misinterpretation.
    (2) "craving" is ALLOWED. It is ordinary English, it appears constantly in unremarkable advice
    about food, spending and addiction, and TH05 requires the model to distinguish craving from
    ordinary preference — banning the word would force circumlocution and destroy the distinction the
    target exists to train. "attachment", "suffering", "compassion", "goodwill", "equanimity",
    "restraint", "generosity", "intention" and "habit" are allowed for the same reason.
    (3) "wholesome", "unwholesome", "skillful" and "unskillful" ARE forbidden. They are the standard
    English renderings of a specific technical pair and read as tradition-flavoured register rather
    than as ordinary usage.
    (4) "monk" and "monastic" are forbidden because the target is lay-scoped and a monastic reference
    would both cue the tradition and violate that scope.
    (5) The eightfold-path factor names are forbidden as phrases; the ordinary words inside them are
    not, so the validator must match the multi-word phrase.
    (6) Matching should be case-insensitive and word-boundary anchored, so that "karma" does not fire
    on "Karman" and "monk" does not fire on "monkey".

