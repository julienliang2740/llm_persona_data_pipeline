evaluation:
  answer_max_tokens: null
  temperature: 0.7
generation:
  baseline_max_tokens: 1600
  counterfactual_fraction: 0.3
  deliberation_fraction: 1.0
  divergence_fraction: 0.4
  eval_family_fraction: 0.0
  eval_prompts_per_family: 1
  explicit_fraction: 0.0
  families_per_call: 4
  family_generation_attempts: 2
  held_out_tradeoffs: 0
  hypothesis_coverage_floor: 1.0
  max_passage_chars_families: 40000
  max_passage_chars_responses: 8000
  n_families: 240
  prompts_per_family: 2
  reframing_families: 0
  reframing_max_jaccard: 0.55
  reframing_variants:
  - setting_shift
  - role_shift
  - fiction
  - roleplay
  - terse
  reserved_family_fraction: 0.0
  target_layers: []
  unresolved_tradeoff_fraction: 0.25
models:
  base:
    api_key_source: none
    base_url: http://127.0.0.1:8080/v1
    max_concurrency: 4
    max_tokens: 1600
    model: qwen2.5-7b-instruct
    supports_json_mode: false
    temperature: 0.7
    timeout_s: 1800
  embeddings:
    api_key_source: fireworks
    base_url: https://api.fireworks.ai/inference/v1
    max_concurrency: 2
    model: accounts/fireworks/models/qwen3-embedding-8b
    supports_json_mode: false
  generator:
    api_key_source: fireworks
    base_url: https://api.fireworks.ai/inference/v1
    extra_body:
      reasoning_effort: low
    max_concurrency: 4
    max_tokens: 24000
    model: accounts/fireworks/models/qwen3p8-max
    temperature: 0.9
  judge:
    api_key_source: fireworks
    base_url: https://api.fireworks.ai/inference/v1
    max_concurrency: 4
    max_tokens: 12000
    model: accounts/fireworks/models/deepseek-v4-pro-0813
    temperature: 0.0
  reviewer:
    api_key_source: fireworks
    base_url: https://api.fireworks.ai/inference/v1
    max_concurrency: 4
    max_tokens: 16000
    model: accounts/fireworks/models/deepseek-v4-pro-0813
    temperature: 0.2
  strong_generic:
    api_key_source: fireworks
    base_url: https://api.fireworks.ai/inference/v1
    max_concurrency: 4
    model: accounts/fireworks/models/qwen3p8-max
pricing_file: configs/pricing.yaml
redistribution_note: ''
runs_dir: runs
strict_specs: true
targets_dir: targets
validation:
  duplicate_floor_embeddings: 0.55
  duplicate_floor_jaccard: 0.35
  duplicate_sigmas: 3.0
  min_fidelity: 4
  min_judgment_not_terminology: 3
  min_scenario_quality: 3
  reject_on_quoted_source: false
  revise_rounds: 1
  second_reviewer_role: ''
  use_embeddings: true
  within_family_duplicate_embeddings: 0.985
  within_family_duplicate_jaccard: 0.9
