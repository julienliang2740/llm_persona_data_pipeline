    - filial piety
    - superior man
    - the Master said
    - sage king
    - Way of Heaven
    - four sprouts
    - four beginnings
    - rites of propriety
    - Chinese philosophy
  allowed_in_explicit_mode: true
  allowed_terms:
    - relationship
    - role
    - obligation
    - respect
    - correction
    - harm
    - severity
    - urgency
    - trust
    - promise
    - repair
    - character
    - habit
    - practice
    - example
    - conditions
    - incentives
    - authority
    - office
    - partiality
    - manner
    - form
    - ceremony
    - mourning
    - grief
    - gratitude
    - shame
    - self-respect
    - fitting
  soft_terms:
    - what is fitting
    - deference
    - defer in manner
    - remonstrate
    - remonstrance
    - keeps the relationship intact
    - closer claim
    - stronger claim
    - harmony
    - propriety
  archaic_register_examples:
    - the superior man
    - the mean man
    - perfect virtue
    - benevolence and righteousness
    - the rules of propriety
    - the Master said
    - the philosopher Tsang
    - filial piety
    - wherewith should I contemplate such ways
    - is he not a man of complete virtue
    - he who would not so rescue the drowning woman is a wolf
    - it is not to be observed in all cases
    - the kingdom may be made to go round in your palm
  notes: >
    Single-syllable romanisations li, yi, de, zhi and he are deliberately excluded from the
    regex list because they collide with ordinary English words and names and would produce
    constant false positives. The reviewer checks for them semantically instead. The list is
    matched case-insensitively on word boundaries.

redistribution_note: >
  Every grounding source for this target is in the public domain (James Legge's Analects and
  Mengzi translations, and the Chinese originals), so the contents of references/ may be
  redistributed and included in generated artifacts without restriction. No copyrighted modern
  translation is quoted anywhere; those are listed reference_only in SOURCES.md.

reference_material:
  - id: key_passages
    path: references/key_passages.md
    title: Curated key passages with grounding notes
    use: grounding
    license: >
      public domain. Compiled for this project from the two public-domain Legge translations
      listed below plus original editorial notes; the most restrictive component is public
      domain, so the file may be redistributed without restriction.
    notes: >
      About 90 passages with short public-domain excerpts and a note on what each grounds.
      This is what is actually placed in generation and review prompts.
  - id: analects_legge
    path: references/analects_legge.txt
    title: The Confucian Analects
    author: Confucius (received text)
    translator: James Legge
    edition: The Chinese Classics vol. I, 1861; rev. 1893
    url: https://www.gutenberg.org/ebooks/3330
    license: public domain
    use: grounding
    passage_id_format: "Analects <book>.<chapter> (Legge's own division)"
    notes: >
      Full text, 499 chapters in 20 books, with the Chinese of each chapter appended. Legge's
      numbering matches the commonly cited numbering except in book 15, where his number is one
      lower from 15.2 on.
  - id: mengzi_legge
    path: references/mengzi_legge.txt
    title: The Works of Mencius
    author: Mencius (Mengzi)
    translator: James Legge
    edition: The Chinese Classics vol. II, 1861; rev. 1895
    url: https://en.wikisource.org/wiki/The_Chinese_Classics/Volume_2/The_Works_of_Mencius
    license: public domain
    use: grounding
    passage_id_format: "Mengzi <book><A|B>.<chapter>, e.g. Mengzi 4A.17"
    notes: >
      Full text, all 260 chapters across the 14 book-parts, bilingual. Chapter boundaries were
      taken from the Chinese edition (Project Gutenberg #24178) and Legge's paragraphs aligned
      to them; the resulting counts match the standard division exactly.
