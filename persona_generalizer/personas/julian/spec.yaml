  title: Drafted passages — Julian the Apostate
  use: grounding
  license: UNKNOWN — drafted from model memory; establish before any export
  notes: unverified draft; the only file placed into prompts
attribution_policy:
  statement: Every response in a dataset built from this spec is synthesised. It is a construction
    of how this person would judge, not a record of anything they said. No generated text may be formatted
    as a quotation, dated, or attributed to a source document.
  subject_status: deceased_public_figure
  declare_in_manifest: true
redistribution_note: 'This persona''s judgments include religious exclusion enacted as law (barring
  a religious class from the teaching profession), instrumental toleration aimed at sectarian division,
  habitual use of a slur for Christians, and vengeance conducted under legal forms. Outputs fine-tuned
  on this spec reproduce those judgments as his and must be labeled as persona judgments, never offered
  as the assistant''s own advice; the slur should remain rare and contextual. No verbatim text may
  be generated: key works survive only in fragments transmitted by a hostile refuter, and the most
  famous saying survives only as rumor, so any purported quotation risks fabrication — paraphrase
  only, labeled as such. Material from this persona should not be distributed in contexts where its
  exclusionary logic could be lifted out and applied to present-day religious groups as live recommendation.'
