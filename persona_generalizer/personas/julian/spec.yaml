sufficiency:
  verdict: admit_with_caveats
  first_person_volume: 'Exceptionally high for an ancient figure — arguably the best-documented Roman
    emperor in his own words after Marcus Aurelius. Survives: a substantial letter corpus (dozens
    of letters, some of disputed authenticity), several full orations (two panegyrics on Constantius,
    the Hymn to King Helios, the Hymn to the Mother of the Gods), the Misopogon (a self-mocking satirical
    address to Antioch), the Caesars (a satire judging his imperial predecessors), and Against the
    Galileans, his anti-Christian polemic, which survives only in fragments quoted by Cyril of Alexandria''s
    refutation. Confidence: high that this corpus exists and is extensive; moderate on exact letter
    counts and authenticity disputes.'
  decisions_with_reasoning: 'Strong — this is the unusual case where the binding criterion is met.
    Multiple major decisions survive with Julian''s own stated reasoning: the restoration of pagan
    cults and temple property (letters and edicts explain his rationale), the school edict barring
    Christians from teaching classical literature (he states the reason openly — that one should not
    teach what one believes false), the revocation of clerical privileges, the price edict and grain
    policy at Antioch (the Misopogon gives his own account and self-justification), the authorization
    to rebuild the Jerusalem Temple (a letter to the Jewish community states his reasoning), and his
    toleration policy deliberately rejecting forced conversion (his letters argue coercion cannot
    produce belief). Ammianus supplies the acts; Julian''s own texts supply the reasons. Confidence:
    high on the substance of these policies; I am reconstructing substance, not wording, and some
    letter attributions are debated.'
  domain_breadth: 'Very broad: theology and religious polemic, Neoplatonic philosophy and theurgy,
    military command (the Rhine campaigns and the Persian expedition), imperial administration and
    taxation, urban politics (Antioch), literary satire, personal ascetic practice, law and edicts,
    and court relationships including his fraught relationship with Constantius II.'
  contestedness: 'Moderate to high on the narrative record, low on the first-person core. The external
    sources are intensely partisan: Gregory of Nazianzus''s invectives and later church historians
    (Socrates, Sozomen, Theodoret) contain legend — the famous dying cry conceding defeat to ''the
    Galilean'' is late and generally regarded as invention. On the other side, Libanius and Eunapius
    are adulatory. Ammianus is the nearest to balanced but openly admires him. The large authentic
    corpus anchors the persona against these distortions, but any dataset must flag hagiographic and
    demonizing material as such.'
  testimonial_variety: 'Excellent and genuinely independent: Ammianus Marcellinus (pagan soldier,
    eyewitness on the Persian campaign), Libanius (pagan rhetor, partisan admirer), Gregory of Nazianzus
    (Christian rival who knew him in Athens and hated him), Ephrem the Syrian (hostile Christian contemporary),
    Eunapius (pagan partisan), later church historians, plus Julian''s own extensive writings. Differing
    interests are richly represented.'
  scope_check: 'In scope. Julian died in 363 CE, so the living-private-individual exclusion does not
    apply. His distinctive value content is religious-philosophical: the attempt to restore polytheism,
    opposition to Christian privilege, Neoplatonic piety, and administrative austerity. Notably, his
    anti-Christian policy was deliberately non-violent — he explicitly rejected coercion and martyrdom-making
    as counterproductive — so his persona is not the direction or advocacy of mass atrocity. His hostility
    to Christianity, his aristocratic disdain (e.g., toward the Antiochenes), and his superstitious
    streak (heavy reliance on sacrifice and divination, noted critically even by Ammianus) are part
    of the record and must be retained, not sanitized.'
  caveats: 1) Against the Galileans, central to his distinctive views, survives only through an enemy's
    quotations — reconstructed content must be labeled as filtered through Cyril. 2) Some letters
    in the corpus are of disputed authenticity. 3) The motive for the Persian campaign is debated
    even in antiquity; his strategic reasoning is less directly documented than his religious reasoning.
    4) Legendary material (deathbed scene, martyr stories, miraculous temple-fire accounts) must be
    tagged as contested, not used as ground truth. 5) All ancient testimony passes through partisan
    filters; confidence labels should reflect this throughout.
