# USD per 1,000,000 tokens, per model id.
#
# Only verified prices belong here. A model that is absent, or whose entry has a
# null price, produces cost_usd: null in runs/.../usage.jsonl, and every report
# then says the cost is "unknown". Nothing is ever guessed silently.
#
# Source: Fireworks Standard-tier price list, recorded in docs/fireworks-notes.md
# (retrieved 2026-09-07). Cached-input discounts exist but the usage ledger does
# not separate cached tokens, so every prompt token is charged at the full input
# rate. Reported cost is therefore an upper bound.

models:
  accounts/fireworks/models/qwen3p8-max:
    input_per_1m_usd: 2.00
    output_per_1m_usd: 6.00
    source: "docs/fireworks-notes.md, Fireworks Standard tier, 2026-09-07"
